name: synergia_flutter_meteor_boilerplate
description: "Boilerplate Flutter offline-first integrado ao Synergia MeteorReactBaseMUI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  audioplayers: ^6.7.1
  crypto: ^3.0.7
  dart_meteor: ^3.0.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  go_router: ^17.2.3
  google_fonts: ^8.0.2
  image_picker: ^1.2.2
  http: ^1.6.0
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^6.2.1
  share_plus: ^12.0.2
  sqflite: ^2.4.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - lib/images/
